name: Fix product image upload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-product-images.yml', 'DEPLOY_IMAGE_PATCH.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image attachment input only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<label class="text-xs font-bold block">رابط صورة المنتج *<input id="pfImage" required class="w-full mt-1 border border-stone-200 rounded-xl p-3 font-normal" placeholder="https://..."></label>'
          new='<label class="text-xs font-bold block">إرفاق صورة المنتج *<input id="pfImage" type="file" accept="image/*" required class="w-full mt-1 border border-stone-200 rounded-xl p-3 font-normal"><span class="block text-[11px] text-stone-400 mt-1">اختر صورة من الهاتف وسيتم تجهيزها تلقائياً للمتجر.</span></label>'
          if new in s:
              print('Image attachment input already present; nothing to change')
          elif old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Image attachment input updated; no other markup changed')
          else:
              raise SystemExit('Exact product image input was not found; design was not changed')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "إضافة إرفاق صورة المنتج من الهاتف"
          git push
